# Named catalogs — reference with "catalog:<name>"
catalogs:
  # The Nest CLI needs the TypeScript compiler API, which TypeScript 7 no longer ships.
  ts6:
    typescript: ~6.0.3

catalogMode: prefer

# Only these dependencies may run install scripts
allowBuilds:
  # drizzle-kit's bundler; the install script links the platform binary.
  esbuild: true
  lefthook: true
  # swagger-ui-dist's install telemetry; not needed.
  '@scarf/scarf': false
  # @grpc/proto-loader (sdk-node's gRPC exporters, @nestjs/terminus); postinstall checks the version scheme.
  protobufjs: true

engineStrict: true

# Grafana Faro (portal-web) still ships OpenTelemetry JS 2.x packages whose peer ranges stop below
# @opentelemetry/api 1.10, which portal-api's SDK 3.x needs. 1.10 is a backward-compatible minor, and one API version
# keeps a single copy of everything that peers on it (two copies split vitest and broke `pnpm test:all`).
peerDependencyRules:
  allowedVersions:
    '@opentelemetry/api': '1'
