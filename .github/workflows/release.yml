name: Release

# Publishing a GitHub release deploys that release to PROD. It reuses the
# images merge.yml deployed for the release's commit (tagged with the merged
# PR number by pr-open.yml) and does not rebuild anything; the deploy signs the
# header manifest with PROD's key (KTD7).
#
# Rollback (KTD13): dispatch this workflow on an earlier release's tag,
#   gh workflow run release.yml --ref <tag>
# It redeploys that release's images with a freshly signed header manifest (new
# expiry, current floor). Never `helm rollback` by hand. Releases cut before the
# signed header (no /release/release.json in their shared-ui image) can't be
# rolled back to.

on:
  release:
    types: [published]
  workflow_dispatch:

# Same group as merge.yml (its workflow name), so the two never deploy PROD at once
concurrency:
  group: Merge
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # The published release's tag, or the tag a rollback was dispatched on (--ref <tag>)
      - name: Tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Dispatch a rollback on a release tag (gh workflow run release.yml --ref <tag>), not ${GITHUB_REF}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # PR number for the release's commit (a squash merge to main)
      - id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1

      - name: Check images
        env:
          PR: ${{ steps.pr.outputs.pr }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "${PR}" ]; then
            echo "::error::No merged PR found for ${RELEASE} (${GITHUB_SHA}). Release from a commit on main that came from a PR."
            exit 1
          fi
          for package in portal-web portal-api console-web console-api gateway-api core-api shared-ui database edge; do
            image="ghcr.io/${REPO}/${package}:${PR}"
            if ! digest=$(docker buildx imagetools inspect "${image}" --format '{{.Manifest.Digest}}'); then
              echo "::error::Image ${image} not found. Packages must be public, and the release's commit must come from a PR that built images."
              exit 1
            fi
            echo "${RELEASE}: ${image} (${digest})" | tee -a "${GITHUB_STEP_SUMMARY}"
          done

  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    # A called workflow can only narrow these: grant what reusable-deploy.yml requests
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    # Inherit so the prod environment supplies OC_TOKEN and HEADER_SIGNING_KEY (explicit `secrets:` hides unpassed env secrets)
    secrets: inherit
    with:
      environment: prod
      target: prod
      tag: ${{ needs.init.outputs.pr }}
      header_floor: ${{ vars.HEADER_FLOOR_PROD }}
      header_version: ${{ needs.init.outputs.tag }}

  # Same as merge.yml's monitor-prod; no-ops if SYSDIG_API_TOKEN is unset
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bcgov/actions-openshift/sysdig-monitor@45d8c7f7d0d5e3b15786cb99a83f410e01547133 # v0.9.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          app: ${{ github.event.repository.name }}
          components: portal-web,portal-api,console-web,console-api,gateway-api,core-api,shared-ui,edge

  promote:
    name: Promote Images
    needs: [deploy-prod, init]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [portal-web, portal-api, console-web, console-api, gateway-api, core-api, shared-ui, database, edge]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: prod
