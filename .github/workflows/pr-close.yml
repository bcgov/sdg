name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Image Promotion
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@a11ad3d1b9288fb40757c4314a62eb86ff227931 # v1.2.1
    permissions:
      packages: write
    secrets:
      oc_namespace: ${{ vars.OC_NAMESPACE }}
      # Without it the helper falls back to Silver
      oc_server: ${{ vars.OC_SERVER }}
      oc_token: ${{ secrets.oc_token }}
    with:
      # helm uninstall <repo>-<pr>; PGO deletes the PostgresCluster's PVCs
      cleanup: helm
      packages: portal-web portal-api portal-database edge
      # The default names the template's Bitnami Postgres PVC
      remove_pvc: ''
