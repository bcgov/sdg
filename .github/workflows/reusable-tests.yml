name: Reusable Tests

on:
  workflow_call:
    inputs:
      ### Required
      url:
        description: Deployment URL, e.g. https://sdg-12.apps.gold.devops.gov.bc.ca (reusable-deploy.yml's url output)
        required: true
        type: string
      ### Optional: both set smokes the edge's console and gateway hosts
      console_url:
        description: Console host URL (reusable-deploy.yml's console_url output)
        default: ''
        type: string
      gateway_url:
        description: Gateway host URL (reusable-deploy.yml's gateway_url output)
        default: ''
        type: string
      keyset:
        description: The header keyset the deployment's loader trusts (pr, test or prod)
        default: pr
        type: string
      playwright-client-username:
        description: Username for portal-web login
        required: true
        type: string
    secrets:
      playwright-client-password:
        description: Password for portal-web login
        required: true

permissions: {}

jobs:
  # Through the edge: portal-web serves /, and /api/auth/me reaches portal-api (signed out, so no session store lookup)
  smoke:
    name: Smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          npm install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          pnpm install --frozen-lockfile
          pnpm --filter tests-load exec playwright install --with-deps chromium
      - name: Wait for portal-web and portal-api
        env:
          BASE_URL: ${{ inputs.url }}
        run: |
          for i in {1..30}; do
            web=$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "${BASE_URL}/" || true)
            api=$(curl --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "${BASE_URL}/api/auth/me" || true)
            if [ "$web" = 200 ] && [ "$api" = 401 ]; then
              echo "portal-web: ${web}, portal-api (signed out): ${api}"
              exit 0
            fi
            echo "Waiting (portal-web HTTP ${web}, portal-api HTTP ${api}; want 200 and 401), retrying in 10s... ($i/30)"
            sleep 10
          done
          echo "ERROR: ${BASE_URL} did not become healthy in time."
          exit 1
      # 2. Run the authentication setup script
      - name: Run Pre-load Test Script
        env:
          E2E_BASE_URL: ${{ inputs.url }}
          PLAYWRIGHT_CLIENT_USERNAME: ${{ inputs.playwright-client-username }}
          PLAYWRIGHT_CLIENT_PASSWORD: ${{ secrets.playwright-client-password }}
          CI: 'true'
        run: pnpm --filter tests-load exec playwright test --project=load-setup
      - uses: actions/upload-artifact@v7
        if: failure()
        name: Upload load-setup results
        with:
          name: playwright-report-load-setup
          path: |
            tests/load/playwright-report
            tests/load/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          flags: --version
      - name: Run Load Tests
        env:
          BASE_URL: ${{ inputs.url }}
          LOAD_PROFILE: smoke
        run: pnpm test:load
      - name: Cleanup Load Auth File
        if: always()
        run: rm -f tests/load/utils/client-auth.json

      # The signed header through the edge (U6): the loader is the committed one for this keyset and revalidated on every
      # load; the manifest verifies with the keyset's public keys; the bundle it names has the manifest's hash and is
      # immutable; the old unsigned script is gone (KTD12). /shared-ui/* is the only path other origins may read.
      # Everything else, /api/auth/me included, stays same-origin with no CORS header.
      - name: Header loader, manifest and bundle
        env:
          BASE_URL: ${{ inputs.url }}
          KEYSET: ${{ inputs.keyset }}
        run: |
          # Downloads go to the runner's temp folder, out of the checkout
          ws="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          header() { grep -i "^$1:" "$2.headers" | head -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ //'; }
          fetch() { curl --connect-timeout 5 --max-time 10 -s -D "$2.headers" -o "$2" -w "%{http_code}" "$1" || true; }
          sha384() { echo "sha384-$(openssl dgst -sha384 -binary "$1" | base64 -w 0)"; }
          failed=0
          expect() {
            if [ "$2" = "$3" ]; then echo "OK: $1 ($2)"; else echo "::error::$1: got '$2', want '$3'"; failed=1; fi
          }
          cross_origin() { # <name> <file>
            expect "$1 Access-Control-Allow-Origin" "$(header Access-Control-Allow-Origin "$2")" '*'
            expect "$1 Cross-Origin-Resource-Policy" "$(header Cross-Origin-Resource-Policy "$2")" cross-origin
          }
          base="${BASE_URL}/shared-ui/header/v1"
          for i in {1..30}; do
            loader=$(fetch "${base}/loader.js" loader.js)
            manifest=$(fetch "${base}/manifest.json" manifest.json)
            [ "$loader" = 200 ] && [ "$manifest" = 200 ] && break
            echo "Waiting (loader.js HTTP ${loader}, manifest.json HTTP ${manifest}; want 200), retrying in 10s... ($i/30)"
            sleep 10
          done
          expect "loader status" "$loader" 200
          expect "loader Cache-Control" "$(header Cache-Control loader.js)" no-cache
          expect "loader integrity (loaders.lock.json ${KEYSET})" "$(sha384 loader.js)" \
            "$(jq -r --arg keyset "$KEYSET" '.[$keyset].integrity' "${ws}/packages/shared-ui/loaders.lock.json")"
          cross_origin loader loader.js
          expect "manifest status" "$manifest" 200
          expect "manifest Cache-Control" "$(header Cache-Control manifest.json)" no-cache
          cross_origin manifest manifest.json
          if payload="$("${ws}/scripts/header-manifest.sh" verify "$KEYSET" manifest.json)"; then
            echo "OK: manifest verifies with keyset ${KEYSET}: ${payload}"
            bundle=$(fetch "${BASE_URL}$(jq -r .bundle.path <<< "$payload")" bundle.js)
            expect "bundle status" "$bundle" 200
            expect "bundle Cache-Control" "$(header Cache-Control bundle.js)" 'public, max-age=31536000, immutable'
            expect "bundle integrity" "$(sha384 bundle.js)" "$(jq -r .bundle.integrity <<< "$payload")"
            cross_origin bundle bundle.js
          else
            echo "::error::${base}/manifest.json does not verify with keyset ${KEYSET}"
            failed=1
          fi
          expect "old unsigned /shared-ui/header/v1/sdg-header.js status" "$(fetch "${base}/sdg-header.js" old.js)" 404
          fetch "${BASE_URL}/api/auth/me" api > /dev/null
          expect "/api/auth/me Cross-Origin-Resource-Policy" "$(header Cross-Origin-Resource-Policy api)" same-origin
          expect "/api/auth/me Access-Control-Allow-Origin" "$(header Access-Control-Allow-Origin api)" ''
          exit "$failed"

      # The edge routes by Host. /telemetry.json is answered by the edge itself, so 200 there shows the console host's
      # Route reaches it; console-web serves / (its title tells it from portal-web) and console-api answers /api/auth/me
      # signed out with 401, like the portal above; the gateway host serves only /api, so / is 404 (portal-web would
      # answer 200). gateway-api forwards a Bearer token to core-api, which refuses this one with 401; without
      # gateway-api or core-api the answer is 502 or 503.
      - name: Console and gateway hosts
        if: inputs.console_url != '' && inputs.gateway_url != ''
        env:
          CONSOLE_URL: ${{ inputs.console_url }}
          GATEWAY_URL: ${{ inputs.gateway_url }}
        run: |
          status() { curl --connect-timeout 5 --max-time 10 -s -o /dev/null -w "%{http_code}" "$@" || true; }
          for i in {1..30}; do
            telemetry=$(status "${CONSOLE_URL}/telemetry.json")
            console_web=$(curl --connect-timeout 5 --max-time 10 -s "${CONSOLE_URL}/" | grep -q '<title>SDG Console</title>' \
              && echo console-web || echo other)
            console_api=$(status "${CONSOLE_URL}/api/auth/me")
            gateway=$(status "${GATEWAY_URL}/")
            gateway_api=$(status -H 'Authorization: Bearer smoke' "${GATEWAY_URL}/api/v1/gateway/me")
            got="console /telemetry.json ${telemetry}, / ${console_web}, /api/auth/me ${console_api}"
            got="${got}; gateway / ${gateway}, /api/v1/gateway/me ${gateway_api}"
            if [ "$telemetry" = 200 ] && [ "$console_web" = console-web ] && [ "$console_api" = 401 ] && [ "$gateway" = 404 ] \
              && [ "$gateway_api" = 401 ]; then
              echo "$got"
              exit 0
            fi
            echo "Waiting (${got}; want 200, console-web, 401; 404, 401), retrying in 10s... ($i/30)"
            sleep 10
          done
          echo "ERROR: the console and gateway hosts did not answer as expected in time."
          exit 1

  # TEST's and PROD's live header manifests (KTD10): each must verify with its keyset and expire in 30 days or more, so
  # a stalled re-signer (header-resign.yml) fails every PR and merge long before the header goes dark. The portal base
  # URLs come from the repository variables TEST_URL and PROD_URL; an unset one is skipped.
  header-expiry:
    name: Live header manifests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check expiry
        env:
          TEST_URL: ${{ vars.TEST_URL }}
          PROD_URL: ${{ vars.PROD_URL }}
          MIN_DAYS: 30
        run: |
          ws="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          failed=0
          for keyset in test prod; do
            var="${keyset^^}_URL"
            if [ -z "${!var}" ]; then
              echo "::notice::${var} is not set; not checking the ${keyset} header manifest"
              continue
            fi
            url="${!var}/shared-ui/header/v1/manifest.json"
            code=$(curl --connect-timeout 5 --max-time 10 -s -o "${keyset}.json" -w "%{http_code}" "$url" || true)
            if [ "$code" != 200 ]; then
              echo "::error::${url}: HTTP ${code}"; failed=1; continue
            fi
            if ! payload="$("${ws}/scripts/header-manifest.sh" verify "$keyset" "${keyset}.json")"; then
              echo "::error::${url} does not verify with keyset ${keyset} (expired, or not signed by a trusted key)"
              failed=1; continue
            fi
            days=$(jq --argjson now "$(date +%s%3N)" '((.expires - $now) / 86400000) | floor' <<< "$payload")
            expires=$(jq -r '.expires / 1000 | todate' <<< "$payload")
            if [ "$days" -lt "$MIN_DAYS" ]; then
              echo "::error::${url} expires ${expires}, in ${days} days (under ${MIN_DAYS}): check the Header Re-sign workflow"
              failed=1
            else
              echo "OK: ${keyset} manifest $(jq -r '"\(.version) (sequence \(.sequence))"' <<< "$payload") expires ${expires}, in ${days} days"
            fi
          done
          exit "$failed"

  # One job per web app (and sharded for portal-web), so each slice runs on its own runner. The Gold cluster refuses or
  # drops every connection from a runner, to every *.apps.gold host, for ~2 minutes once it opens too many (PR 82: after
  # ~115 new connections in ~30s); separate runners each get their own allowance, and the slices run in parallel.
  # @repo/playwright-config keeps one browser context per worker (reuseContext) so connections stay open across tests,
  # and makes a retry wait until the host answers again.
  e2e-tests:
    name: E2E (${{ matrix.name }})
    needs: smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal-web (1/2)
            app: portal-web
            url: ${{ inputs.url }}
            shard: --shard=1/2
            run_unauthenticated: true
            run_client: false
            report: playwright-report-chromium-1
          - name: portal-web (2/2)
            app: portal-web
            url: ${{ inputs.url }}
            shard: --shard=2/2
            run_unauthenticated: true
            run_client: false
            report: playwright-report-chromium-2
          - name: portal-web (authenticated)
            app: portal-web
            url: ${{ inputs.url }}
            shard: ''
            run_unauthenticated: false
            run_client: true
            report: playwright-report-chromium-authenticated
          # console-web's signed-out specs against the console host (the authenticated ones need an admin test account and
          # skip). Without console_url the job runs no steps.
          - name: console-web
            app: console-web
            url: ${{ inputs.console_url }}
            shard: ''
            run_unauthenticated: true
            run_client: false
            report: playwright-report-console-web-chromium
    steps:
      - uses: actions/checkout@v7
        if: matrix.url != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: matrix.url != ''
        with:
          node-version-file: .node-version
      - name: Install dependencies
        if: matrix.url != ''
        env:
          APP: ${{ matrix.app }}
        run: |
          npm install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          pnpm install --frozen-lockfile
          pnpm --filter "$APP" exec playwright install --with-deps chromium

      - name: Run Tests
        if: matrix.url != '' && matrix.run_unauthenticated
        env:
          APP: ${{ matrix.app }}
          E2E_BASE_URL: ${{ matrix.url }}/
          PLAYWRIGHT_HTML_REPORT: playwright-report/unauthenticated
          CI: 'true'
          PORTAL_URL: ${{ inputs.url }}
          CONSOLE_URL: ${{ inputs.console_url }}
          DIAGNOSTICS: ${{ runner.temp }}/e2e-diagnostics
        # Diagnosing the Gold cluster's refused connections: Playwright logs every new connection and failed request
        # (E2E_CONNECTION_LOG), while scripts/e2e-probe.sh polls both PR hosts and a non-Gold control from the same runner
        # every 15s (slow, since its own connections count against the runner's allowance).
        run: |
          mkdir -p "$DIAGNOSTICS"
          export E2E_CONNECTION_LOG="$DIAGNOSTICS/connections.ndjson"
          urls=("$PORTAL_URL/")
          if [ -n "$CONSOLE_URL" ]; then urls+=("$CONSOLE_URL/"); fi
          urls+=("https://github.com/")
          scripts/e2e-probe.sh "$DIAGNOSTICS/probe.log" "${urls[@]}" &
          probe=$!
          status=0
          pnpm --filter "$APP" exec playwright test --project=chromium ${{ matrix.shard }} --reporter=html || status=$?
          kill "$probe"
          echo "New connections opened by the browser: $(grep -c '"event":"connect"' "$E2E_CONNECTION_LOG" || true)"
          echo "Probe requests that failed:"
          grep -v ' rc=0 ' "$DIAGNOSTICS/probe.log" || echo "  none"
          exit "$status"
      - name: Run Client Setup Script
        if: matrix.url != '' && matrix.run_client
        env:
          E2E_BASE_URL: ${{ matrix.url }}/
          PLAYWRIGHT_CLIENT_USERNAME: ${{ inputs.playwright-client-username }}
          PLAYWRIGHT_CLIENT_PASSWORD: ${{ secrets.playwright-client-password }}
          CI: 'true'
        run: pnpm --filter portal-web exec playwright test --project=client-setup
      - name: Run Client Tests
        if: matrix.url != '' && matrix.run_client
        env:
          E2E_BASE_URL: ${{ matrix.url }}/
          PLAYWRIGHT_HTML_REPORT: playwright-report/authenticated
          CI: 'true'
        run: pnpm --filter portal-web exec playwright test --project=client-tests --reporter=html
      - name: Cleanup Client Auth File
        if: always() && matrix.run_client
        run: rm -f apps/portal-web/e2e/setup/client-auth.json

      - uses: actions/upload-artifact@v7
        if: (! cancelled()) && matrix.url != '' && matrix.run_unauthenticated
        name: upload diagnostics
        with:
          name: e2e-diagnostics-${{ matrix.report }}
          path: ${{ runner.temp }}/e2e-diagnostics
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: (! cancelled()) && matrix.url != ''
        name: upload results
        with:
          name: ${{ matrix.report }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 7
