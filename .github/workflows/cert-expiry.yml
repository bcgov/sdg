name: Cert Expiry

on:
  schedule:
    # Monday 08:17 PT (15:17 UTC)
    - cron: '17 15 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  cert-expiry:
    name: TLS Certificate Expiry
    if: vars.ROUTE_HOST != ''
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # workflow-notifier reads CODEOWNERS from the workspace
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check certificate expiry
        id: check
        uses: bcgov/actions-openshift/cert-expiry@a7a039ba45f9635c0bdbcc6b4cdbd2555811e100 # v0.8.0
        with:
          hosts: ${{ vars.ROUTE_HOST }}
          days: '30'

      - name: Notify CODEOWNERS
        if: failure() && steps.check.outputs.findings != '' && steps.check.outputs.findings != '[]'
        uses: bcgov/actions/workflow-notifier@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          title: 'TLS certificate expiring or unreadable'
          labels: ''
          notify_author: 'false'
          notify_codeowners: 'true'
