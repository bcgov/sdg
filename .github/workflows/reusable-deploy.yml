# Reusable Deploy: installs the charts/sdg umbrella as release <repo>-<target> (DEVELOPER.md, Workflows)
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (test or prod); omit for PRs
        default: ''
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Paths that trigger a deployment; omit to always deploy
        default: ''
        type: string
      header_floor:
        description: The header manifest's floor, a build sequence (KTD8); '0' for PRs, HEADER_FLOOR_TEST or HEADER_FLOOR_PROD
        required: true
        type: string
      header_version:
        description: The header release's display label in the signed manifest, e.g. pr-123 or a release tag
        required: true
        type: string

    secrets:
      oc_token:
        description: OpenShift token
        required: true
      header_signing_key:
        # TEST and PROD callers use `secrets: inherit` so the job's environment supplies HEADER_SIGNING_KEY and OC_TOKEN
        # (explicit `secrets:` hides unpassed environment secrets); PR callers pass HEADER_SIGNING_KEY_PR explicitly (R6).
        description: The pr keyset's private signing key (HEADER_SIGNING_KEY_PR); PRs only
        required: false
    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.deploy.outputs.triggered }}
      url:
        description: Public URL of the deployment (portal)
        value: ${{ jobs.deploy.outputs.url }}
      console_url:
        description: Public URL of the console host
        value: ${{ jobs.deploy.outputs.console_url }}
      gateway_url:
        description: Public URL of the gateway host
        value: ${{ jobs.deploy.outputs.gateway_url }}

permissions: {}

jobs:
  deploy:
    name: Helm (${{ inputs.target }})
    environment: ${{ inputs.environment }}
    permissions:
      # actions: read finds the previous signing record after a failed upgrade (scripts/header-manifest.sh record)
      actions: read
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
      url: ${{ steps.vars.outputs.url }}
      console_url: ${{ steps.vars.outputs.console_url }}
      gateway_url: ${{ steps.vars.outputs.gateway_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      TARGET: ${{ inputs.target }}
      ENVIRONMENT: ${{ inputs.environment }}
      TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}
      OC_NAMESPACE: ${{ vars.OC_NAMESPACE }}
      OC_SERVER: ${{ vars.OC_SERVER }}
      KEYCLOAK_ISSUER_URL: ${{ vars.KEYCLOAK_ISSUER_URL }}
      KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
      # The console (IDIR) client: console-api signs in with it and core-api accepts its tokens
      KEYCLOAK_CONSOLE_CLIENT_ID: ${{ vars.KEYCLOAK_CONSOLE_CLIENT_ID }}
      # Optional override; see scripts/deploy-values.sh
      VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
      CONSOLE_VAULT_SECRET_PATH: ${{ vars.CONSOLE_VAULT_SECRET_PATH }}
      # Optional: "true" reports to the observability stack (doc 20; scripts/deploy-values.sh)
      OBSERVABILITY: ${{ vars.OBSERVABILITY }}
      # The keyset whose loader the environment serves (KTD5) and whose key signs its manifest
      HEADER_KEYSET: ${{ inputs.environment || 'pr' }}
      HEADER_FLOOR: ${{ inputs.header_floor }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Release name, URLs and values file come from one script, shared with scripts/charts-test.sh;
      # release=, url=, console_url=, gateway_url= and values_file= become step outputs and env vars below
      - name: Vars
        id: vars
        run: |
          scripts/deploy-values.sh outputs | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_ENV"
          scripts/deploy-values.sh values > "${RUNNER_TEMP}/deploy-values.yaml"
          echo "DEPLOY_VALUES=${RUNNER_TEMP}/deploy-values.yaml" >> "$GITHUB_ENV"
          # Outside the workspace: action-oc-runner checks the repository out again, which cleans it
          echo "HEADER_DIR=${RUNNER_TEMP}/header" >> "$GITHUB_ENV"

      # The same diff action-oc-runner runs below, so an untriggered PR signs nothing. Skipped without triggers (TEST
      # and PROD): the action checks out github.ref, which can be newer than the commit this run deploys.
      - name: Triggers
        id: triggers
        if: inputs.triggers != ''
        uses: bcgov/action-diff-triggers@a80e4b3cf77b7e05f84e74030e3bfa08b717a574 # v1.2.1
        with:
          triggers: ${{ inputs.triggers }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Header signing needed
        id: header
        env:
          SIGN: ${{ inputs.triggers == '' || steps.triggers.outputs.triggered == 'true' }}
        run: echo "sign=${SIGN}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.header.outputs.sign == 'true'
        with:
          node-version-file: .node-version

      # What to sign comes from the shared-ui image this deploy runs (KTD7): bundle path, integrity and build sequence
      - name: Header release
        if: steps.header.outputs.sign == 'true'
        run: |
          mkdir -p "$HEADER_DIR"
          image="ghcr.io/${REPOSITORY,,}/shared-ui:${TAG}"
          docker pull --quiet "$image"
          container="$(docker create "$image")"
          docker cp "${container}:/release/release.json" "${HEADER_DIR}/release.json"
          docker rm "$container" > /dev/null
          echo "${image}: $(jq -c . "${HEADER_DIR}/release.json")"

      # A PR can overwrite its PR-number image tag, so TEST and PROD trust the tag's release.json only when the deployed
      # commit rebuilds the same bundle (KTD7). The image's sequence is reused so only the bundle can differ.
      - name: Rebuild header bundle
        if: steps.header.outputs.sign == 'true' && inputs.environment != ''
        run: |
          npm install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"
          pnpm install --frozen-lockfile --filter "@repo/shared-ui..."
          HEADER_BUILD_SEQUENCE="$(jq -r .sequence "${HEADER_DIR}/release.json")" \
            pnpm --filter @repo/shared-ui exec vite build --mode cdn
          built="$(jq -c .bundle packages/shared-ui/dist/release.json)"
          deployed="$(jq -c .bundle "${HEADER_DIR}/release.json")"
          if [ "$built" != "$deployed" ]; then
            echo "::error::shared-ui:${TAG} is not ${GITHUB_SHA}'s build: image bundle ${deployed}, rebuilt ${built}. Not signing."
            exit 1
          fi
          echo "Rebuilt ${GITHUB_SHA}: ${built} matches the image"

      - name: Sign header manifest
        if: steps.header.outputs.sign == 'true'
        env:
          HEADER_SIGNING_KEY: ${{ secrets.header_signing_key }}
          HEADER_SIGNING_KEY_ID: ${{ inputs.environment == '' && vars.HEADER_SIGNING_KEY_ID_PR || vars.HEADER_SIGNING_KEY_ID }}
          VERSION: ${{ inputs.header_version }}
        run: |
          node packages/shared-ui/scripts/sign-manifest.ts release --release "${HEADER_DIR}/release.json" \
            --version "$VERSION" --out "${HEADER_DIR}/manifest.json"

      # The charts are verified with Helm 4; the runner image ships Helm 3
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Deploy
        id: deploy
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          triggers: ${{ inputs.triggers }}
          commands: |
            # A cancelled run leaves the release pending-*, which blocks every later upgrade
            status="$(helm status "$release" -o json 2>/dev/null | jq -r .info.status || true)"
            if [[ "$status" == pending-* ]]; then
              echo "Release ${release} is ${status}; rolling back"
              helm rollback "$release" --server-side=true --force-conflicts --wait --timeout 5m \
                || helm uninstall "$release" --wait --timeout 5m
            fi

            # file:// dependencies: leaf charts before the umbrella, which packages them
            for chart in portal-web portal-api console-web console-api gateway-api core-api shared-ui edge postgres sdg; do
              helm dependency build "charts/${chart}" > /dev/null
            done

            # On an upgrade where a live manifest ConfigMap already exists, keep the live manifest untouched while Helm
            # rolls out the new pods so old pods never serve a manifest pointing at a bundle hash they don't ship (nor
            # break for up to 15m if the new pod fails to become Ready). Once helm upgrade succeeds, patch the ConfigMap
            # with the newly signed manifest.
            helm_manifest="${HEADER_DIR}/manifest.json"
            defer_manifest_patch=false
            if oc get configmap "${release}-shared-ui-manifest" -o jsonpath='{.data.manifest\.json}' > "${HEADER_DIR}/live-manifest.json" 2>/dev/null \
              && [ -s "${HEADER_DIR}/live-manifest.json" ]; then
              helm_manifest="${HEADER_DIR}/live-manifest.json"
              defer_manifest_patch=true
            fi

            # A first install waits for PGO's cluster and the migrator's retries. Server-side apply with forced
            # conflicts: the re-signer patches the manifest ConfigMap under its own field manager (header-resign.yml),
            # and the chart's values must win again here, as with client-side apply. A failed upgrade's rollback
            # inherits both flags.
            helm upgrade --install "$release" charts/sdg \
              -f "$values_file" -f "$DEPLOY_VALUES" \
              --set-file "shared-ui.manifest=${helm_manifest}" \
              --server-side=true --force-conflicts \
              --rollback-on-failure --timeout 15m

            if [ "$defer_manifest_patch" = true ]; then
              jq -n --rawfile manifest "${HEADER_DIR}/manifest.json" '{data: {"manifest.json": $manifest}}' \
                > "${HEADER_DIR}/deploy-patch.json"
              oc patch configmap "${release}-shared-ui-manifest" --type=merge --field-manager=header-deploy \
                --patch-file "${HEADER_DIR}/deploy-patch.json"
            fi
            helm status "$release"

      # CI's record of this signature, which the re-signer (header-resign.yml) and a later failed deploy re-sign from
      - name: Upload header record
        if: steps.deploy.outputs.triggered == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: header-manifest-${{ inputs.target }}
          path: ${{ env.HEADER_DIR }}/manifest.json
          if-no-files-found: error

      # A failed upgrade was rolled back (--rollback-on-failure, after any pending-* recovery), or never replaced the
      # previous release: the live ConfigMap holds the manifest stored with that release, signed back then. Re-sign CI's
      # newest record (the release now live) with a fresh expiry and the current floor and write it (KTD13). The job has
      # failed either way; if this step fails too, its error says why the restored manifest was left as it was. PR
      # environments are throwaway and keep the restored manifest.
      - name: Re-sign the restored release
        id: resign
        if: failure() && steps.deploy.outcome == 'failure' && inputs.environment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEADER_SIGNING_KEY: ${{ secrets.header_signing_key }}
          HEADER_SIGNING_KEY_ID: ${{ vars.HEADER_SIGNING_KEY_ID }}
        run: |
          scripts/header-manifest.sh record "$TARGET" "${HEADER_DIR}/previous"
          mkdir -p "${HEADER_DIR}/restored"
          # Confirm the restored ConfigMap carries the same release sequence as CI's record before patching, and guard
          # the patch with its resourceVersion (still logged in as action-oc-runner left it; its token lasts 25 minutes).
          oc get configmap "${release}-shared-ui-manifest" -o json > "${HEADER_DIR}/restored/cm.json"
          rv="$(jq -r '.metadata.resourceVersion' "${HEADER_DIR}/restored/cm.json")"
          jq -r '.data["manifest.json"] // empty' "${HEADER_DIR}/restored/cm.json" > "${HEADER_DIR}/restored/cm-manifest.json"
          live_seq="$(scripts/header-manifest.sh verify "$HEADER_KEYSET" "${HEADER_DIR}/restored/cm-manifest.json" --accept-expired | jq -r .sequence)"
          rec_seq="$(scripts/header-manifest.sh verify "$HEADER_KEYSET" "${HEADER_DIR}/previous/manifest.json" --accept-expired | jq -r .sequence)"
          if [ "$live_seq" != "$rec_seq" ]; then
            echo "::error::Restored ConfigMap sequence ${live_seq} differs from CI record ${rec_seq}; not patching or uploading record"
            exit 1
          fi
          node packages/shared-ui/scripts/sign-manifest.ts resign --record "${HEADER_DIR}/previous/manifest.json" \
            --out "${HEADER_DIR}/restored/manifest.json"
          jq -n --arg rv "$rv" --rawfile manifest "${HEADER_DIR}/restored/manifest.json" \
            '{metadata: {resourceVersion: $rv}, data: {"manifest.json": $manifest}}' \
            > "${HEADER_DIR}/restored/patch.json"
          oc patch configmap "${release}-shared-ui-manifest" --type=merge --field-manager=header-resign \
            --patch-file "${HEADER_DIR}/restored/patch.json"

      - name: Upload restored header record
        if: failure() && steps.resign.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: header-manifest-${{ inputs.target }}
          path: ${{ env.HEADER_DIR }}/restored/manifest.json
          if-no-files-found: error
