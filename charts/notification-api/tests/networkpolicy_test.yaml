suite: notification-api networkpolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: sdg
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-1
  global.host: sdg.example.com
  keycloak.issuerUrl: https://keycloak.example.com/realms/portal
  keycloak.clientId: notification-api
  vault.role: abc123-nonprod
  vault.secretPath: abc123-nonprod/notification-api
  vault.serviceAccountName: abc123-vault
tests:
  - it: covers every notification-api pod and admits only the edge and portal-api on 3000
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: sdg-notification-api
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: notification-api
            app.kubernetes.io/instance: sdg
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: edge
                      app.kubernetes.io/instance: sdg
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: portal-api
                      app.kubernetes.io/instance: sdg
              ports:
                - port: 3000
                  protocol: TCP

  - it: is the same in combined mode
    set:
      mode: combined
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: notification-api
            app.kubernetes.io/instance: sdg
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: omits the NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: admits the observability stack's Alloy on 3000 when a scraper namespace is set
    set:
      global.observability.scraperNamespace: abc123-tools
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: abc123-tools
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: alloy
            ports:
              - port: 3000
                protocol: TCP
