{{- if and (not .Values.vault.enabled) (not .Values.existingSecret) }}
{{- fail "existingSecret is required when vault.enabled is false" }}
{{- end }}
{{- range $role := include "notification-api.roles" $ | fromJsonArray }}
---
# NOTIFICATION_ROLE={{ $role }} (KTD1). Selects on its component, which a Deployment can never change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-api.deploymentName" (dict "context" $ "role" $role) }}
  labels:
    {{- include "common.labels" (dict "context" $ "component" $role) | nindent 4 }}
spec:
  replicas: {{ index $.Values.replicaCount $role }}
  {{- with index $.Values.strategy $role }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "notification-api.selectorLabels" (dict "context" $ "role" $role) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels" (dict "context" $ "component" $role) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with include "common.scrapeAnnotations" (dict "context" $ "port" 3000) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if $.Values.vault.enabled }}
        {{- include "common.vaultAnnotations" (dict "vault" $.Values.vault "envFile" "notification-api.env") | nindent 8 }}
        {{- end }}
    spec:
      {{- if $.Values.vault.enabled }}
      # The Vault agent authenticates with this service account's token.
      serviceAccountName: {{ $.Values.vault.serviceAccountName | required "vault.serviceAccountName is required when vault.enabled is true" }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- include "common.podSecurityContext" $ | nindent 8 }}
      initContainers:
        # Applies pending migrations under an advisory lock; a non-zero exit keeps notification-api from starting.
        - name: migrate
          image: {{ include "common.image" (dict "image" $.Values.migrator.image "context" $) }}
          imagePullPolicy: {{ $.Values.migrator.image.pullPolicy }}
          env:
            {{- include "common.databaseUrlEnv" (dict "database" $.Values.database "context" $) | nindent 12 }}
          securityContext:
            {{- include "common.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.migrator.resources | nindent 12 }}
          {{- with include "common.postgresCaMount" $.Values.database }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      containers:
        - name: notification-api
          image: {{ include "common.image" (dict "image" $.Values.image "context" $) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if $.Values.vault.enabled }}
          # --import preloads OpenTelemetry (a no-op without OTEL_EXPORTER_OTLP_ENDPOINT), as the image's CMD does.
          command: [node, --env-file=/vault/secrets/notification-api.env, --import=./dist/instrumentation.js, dist/main.js]
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "common.fullname" $ }}
            {{- if not $.Values.vault.enabled }}
            - secretRef:
                name: {{ $.Values.existingSecret }}
            {{- end }}
          env:
            - name: NOTIFICATION_ROLE
              value: {{ $role }}
            {{- include "common.databaseUrlEnv" (dict "database" $.Values.database "context" $) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
          securityContext:
            {{- include "common.containerSecurityContext" $ | nindent 12 }}
          resources:
            {{- toYaml (index $.Values.resources $role) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with include "common.postgresCaMount" $.Values.database }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with include "common.postgresCaVolume" (dict "database" $.Values.database "context" $) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
