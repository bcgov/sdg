# Alloy's identity for pod discovery. Each source namespace binds it to a read-only Role on pods (charts/sdg).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability.name" (dict "context" . "component" "alloy") }}
  labels:
    {{- include "observability.labels" (dict "context" . "component" "alloy") | nindent 4 }}
