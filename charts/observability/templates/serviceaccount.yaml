# Alloy's identity for pod discovery. Each source namespace binds it to a read-only Role on pods, made once by a person
# with scripts/setup-openshift.sh --observability (the deploy account can't manage RBAC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "observability.name" (dict "context" . "component" "alloy") }}
  labels:
    {{- include "observability.labels" (dict "context" . "component" "alloy") | nindent 4 }}
