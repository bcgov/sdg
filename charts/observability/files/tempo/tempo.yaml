# Tempo 3 (doc 20): single binary (-target=all) on a filesystem volume, loaded with -config.expand-env=true.
# TEMPO_RETENTION sets how long traces are kept (e.g. 168h); PROMETHEUS_URL receives span metrics and service graphs.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: ${PROMETHEUS_URL}/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_RETENTION:-168h}

backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION:-168h}

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
