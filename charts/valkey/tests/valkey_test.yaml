suite: valkey
release:
  name: sdg
tests:
  - it: generates a 32-character alphanumeric password with a matching URL and auth.conf
    template: templates/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: sdg-valkey
      - matchRegex:
          path: stringData.password
          pattern: ^[A-Za-z0-9]{32}$
      - matchRegex:
          path: stringData.url
          pattern: ^redis://:[A-Za-z0-9]{32}@sdg-valkey:6379$
      - matchRegex:
          path: stringData["auth.conf"]
          pattern: ^requirepass [A-Za-z0-9]{32}\n$

  - it: reuses the existing Secret so upgrades never rotate the password
    template: templates/secret.yaml
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: sdg-valkey
            namespace: NAMESPACE
          data:
            password: ZXhpc3RpbmdQYXNzd29yZDEyMzQ1Njc4OTAxMjM0NTY3
    release:
      namespace: NAMESPACE
    asserts:
      - equal:
          path: stringData.password
          value: existingPassword12345678901234567
      - equal:
          path: stringData.url
          value: redis://:existingPassword12345678901234567@sdg-valkey:6379

  - it: configures AOF persistence, memory limit and includes the auth file
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sdg-valkey
      - equal:
          path: data["valkey.conf"]
          value: |
            bind * -::*
            port 6379
            dir /data
            appendonly yes
            maxmemory 100mb
            maxmemory-policy volatile-lru
            include /etc/valkey/secret/auth.conf

  - it: runs one valkey pod from the official image with the config file
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: sdg-valkey
      - equal:
          path: spec.serviceName
          value: sdg-valkey-headless
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/valkey/valkey:9.2-alpine
      - equal:
          path: spec.template.spec.containers[0].args
          value: [/etc/valkey/valkey.conf]
      - equal:
          path: spec.template.spec.containers[0].command
          value: [valkey-server]

  - it: probes with valkey-cli using REDISCLI_AUTH from the Secret
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDISCLI_AUTH
            valueFrom:
              secretKeyRef:
                name: sdg-valkey
                key: password
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: [valkey-cli, ping]
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: [valkey-cli, ping]

  - it: runs restricted with a read-only root
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: persists /data on a 256Mi claim by default
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - equal:
          path: spec.volumeClaimTemplates[0].spec
          value:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 256Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data

  - it: uses an emptyDir for /data when persistence is off
    template: templates/statefulset.yaml
    set:
      persistence.enabled: false
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: rolls the pod when the config changes
    template: templates/statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: renders a ClusterIP and a headless Service on 6379
    template: templates/service.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.ports[0]
          value:
            name: valkey
            port: 6379
            targetPort: valkey
            protocol: TCP
      - equal:
          path: metadata.name
          value: sdg-valkey
        documentIndex: 0
      - equal:
          path: metadata.name
          value: sdg-valkey-headless
        documentIndex: 1
      - equal:
          path: spec.clusterIP
          value: None
        documentIndex: 1

  - it: only accepts portal-api on 6379
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: portal-api
                      app.kubernetes.io/instance: sdg
              ports:
                - port: 6379
                  protocol: TCP
