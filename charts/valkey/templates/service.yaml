apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "cache") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
---
# Governing Service for the StatefulSet's stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.fullname" . }}-headless
  labels:
    {{- include "common.labels" (dict "context" . "component" "cache") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
  selector:
    {{- include "common.selectorLabels" . | nindent 4 }}
