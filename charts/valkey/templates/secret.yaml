{{- $name := include "common.fullname" . }}
{{- /* Reuse the existing password so an upgrade never rotates it under live sessions. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 32 }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "cache") | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  # VALKEY_URL for portal-api. The password is alphanumeric, so it needs no URL escaping.
  url: {{ printf "redis://:%s@%s:6379" $password $name | quote }}
  # Included by valkey.conf, so the password never appears in process args.
  auth.conf: |
    requirepass {{ $password }}
