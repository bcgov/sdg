# Env for src/config/env.ts. gateway-api has no secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "api") | nindent 4 }}
data:
  NODE_ENV: production
  PORT: '3000'
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  # Ingress -> edge -> gateway-api: trust X-Forwarded-* from the proxies.
  TRUST_PROXY: 'true'
  CORE_API_URL: {{ include "common.tplvalue" (dict "value" .Values.coreApiUrl "context" .) | required "coreApiUrl is required" | quote }}
  {{- $o := include "common.observability" . | fromYaml }}
  {{- with $o.collectorHost }}
  # OpenTelemetry (src/instrumentation.ts): only when a collector is configured.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s:4318" . | quote }}
  OTEL_SERVICE_NAME: gateway-api
  {{- with $o.environment }}
  OTEL_RESOURCE_ATTRIBUTES: {{ printf "deployment.environment=%s" . | quote }}
  {{- end }}
  {{- end }}
