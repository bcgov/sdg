# sdg: installs the whole stack as one release. Each subchart's values sit under its name; see its values.yaml.
global:
  image:
    # Required: registry path shared by the app images, e.g. ghcr.io/<owner>/sdg
    registry: ''
    # Required: image tag, e.g. a PR number (12), a commit SHA or a release version
    tag: ''
  # Public hostname: the edge Ingress host and portal-api's APP_URL (https://<host>).
  host: ''
  # Admin and gateway hostnames (edge Ingress rules and Host routing), e.g. <release>-admin and <release>-gateway
  # on the same apps domain. Empty: the edge serves no such host. adminHost is required while admin-api is enabled
  # (its APP_URL is https://<adminHost>).
  adminHost: ''
  gatewayHost: ''
  # Observability stack this release reports to (doc 20; charts/observability). All empty: telemetry off.
  observability:
    # Alloy's Service host, e.g. observability-alloy.abc123-tools.svc
    collectorHost: ''
    # Namespace of the Alloy that scrapes this release, e.g. abc123-tools (prod: abc123-prod)
    scraperNamespace: ''
    # pr-<n> | test | prod
    environment: ''

portal-web:
  enabled: true

portal-api:
  enabled: true
  keycloak:
    # Required, e.g. https://keycloak.example.com/realms/portal
    issuerUrl: ''
    # Required
    clientId: ''
  vault:
    enabled: true
    # Required when enabled, e.g. abc123-nonprod
    role: ''
    # Required when enabled, e.g. abc123-nonprod/portal-api (KV v2 holding SESSION_SECRET, KEYCLOAK_CLIENT_SECRET)
    secretPath: ''
    # Required when enabled, e.g. abc123-vault
    serviceAccountName: ''

admin-web:
  enabled: true

admin-api:
  enabled: true
  keycloak:
    # Required: the same realm as portal-api
    issuerUrl: ''
    # Required: the admin (IDIR) client, with the admin client role; core-api's adminClientId below names it too
    clientId: ''
  vault:
    enabled: true
    # Required when enabled, e.g. abc123-nonprod
    role: ''
    # Required when enabled, e.g. abc123-nonprod/admin-api (KV v2 holding SESSION_SECRET, KEYCLOAK_CLIENT_SECRET)
    secretPath: ''
    # Required when enabled, e.g. abc123-vault
    serviceAccountName: ''

core-api:
  enabled: true
  keycloak:
    # Required: the same realm as portal-api, e.g. https://keycloak.example.com/realms/portal
    issuerUrl: ''
    # Required: portal-api's client id (keycloak.clientId above)
    portalClientId: ''
    # Required: admin-api's client id (admin-api.keycloak.clientId above); empty, no admin-client token is accepted
    adminClientId: ''

edge:
  enabled: true
  # The admin host: /api to admin-api, everything else to admin-web.
  upstreams:
    adminApi: 'http://{{ .Release.Name }}-admin-api:3000'
    adminWeb: 'http://{{ .Release.Name }}-admin-web:8080'

postgres:
  enabled: true
