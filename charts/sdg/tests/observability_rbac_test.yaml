# MDD 20-observability-lgtm: read-only pod discovery for the observability stack's Alloy.
suite: sdg observability rbac
templates:
  - templates/observability-rbac.yaml
release:
  name: sdg-12
  namespace: abc123-dev
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-12
  global.host: sdg-12.apps.example.com
  portal-api.keycloak.issuerUrl: https://keycloak.example.com/realms/portal
  portal-api.keycloak.clientId: portal
  portal-api.vault.role: abc123-nonprod
  portal-api.vault.secretPath: abc123-nonprod/portal-api
  portal-api.vault.serviceAccountName: abc123-vault
tests:
  - it: renders nothing when observability is not configured
    asserts:
      - hasDocuments:
          count: 0

  - it: grants Alloy in the scraper namespace read-only access to pods
    set:
      global.observability.scraperNamespace: abc123-tools
      global.observability.scraperServiceAccount: observability-alloy
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: sdg-12-observability-discovery
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources: [pods]
              verbs: [get, list, watch]
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: observability-alloy
              namespace: abc123-tools
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: sdg-12-observability-discovery
        documentIndex: 1
