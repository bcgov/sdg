apiVersion: v2
name: sdg
description: 'Umbrella chart installing portal-web, portal-api, admin-web, admin-api, gateway-api, core-api, edge and postgres as one release.'
type: application
version: 0.1.0
appVersion: '0.1.0'
dependencies:
  - name: portal-web
    version: 0.1.0
    repository: file://../portal-web
    condition: portal-web.enabled
  - name: portal-api
    version: 0.1.0
    repository: file://../portal-api
    condition: portal-api.enabled
  - name: admin-web
    version: 0.1.0
    repository: file://../admin-web
    condition: admin-web.enabled
  - name: admin-api
    version: 0.1.0
    repository: file://../admin-api
    condition: admin-api.enabled
  - name: gateway-api
    version: 0.1.0
    repository: file://../gateway-api
    condition: gateway-api.enabled
  - name: core-api
    version: 0.1.0
    repository: file://../core-api
    condition: core-api.enabled
  - name: edge
    version: 0.1.0
    repository: file://../edge
    condition: edge.enabled
  - name: postgres
    version: 0.1.0
    repository: file://../postgres
    condition: postgres.enabled
