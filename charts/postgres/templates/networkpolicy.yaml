{{- if .Values.networkPolicy.enabled }}
# The services with a database login (core-api, portal-api, console-api) connect on 5432; the cluster's own pods
# (instances, pgBackRest) talk to each other on any port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: {{ include "common.fullname" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.clients }}
        - podSelector:
            matchLabels:
              {{- include "common.peerSelectorLabels" (dict "name" . "context" $) | nindent 14 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: {{ include "common.fullname" . }}
{{- end }}
