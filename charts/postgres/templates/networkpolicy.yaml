{{- if .Values.networkPolicy.enabled }}
# portal-api connects on 5432; the cluster's own pods (instances, pgBackRest) talk to each other on any port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: {{ include "common.fullname" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "common.peerSelectorLabels" (dict "name" "portal-api" "context" $) | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: {{ include "common.fullname" . }}
{{- end }}
