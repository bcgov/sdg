apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels" (dict "context" . "component" "web") | nindent 8 }}
      annotations:
        # A deploy's new manifest rolls the pods; the re-signer's patch reaches them through the directory mount.
        checksum/manifest: {{ .Values.manifest | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: shared-ui
          image: {{ include "common.image" (dict "image" .Values.image "context" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.keyset }}
          # Picks the committed loader Caddy serves at /header/v1/loader.js (KTD5). Unset, that URL is a 404.
          env:
            - name: HEADER_KEYSET
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            {{- include "common.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Caddy's state dirs (XDG_CONFIG_HOME / XDG_DATA_HOME in the image), and the manifest ConfigMap as a
          # directory outside /srv. Never subPath: a subPath mount never sees a patched ConfigMap.
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: manifest
              mountPath: /manifest
              readOnly: true
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: manifest
          configMap:
            name: {{ include "common.fullname" . }}-manifest
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
