suite: shared-ui
release:
  name: sdg
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-1
tests:
  - it: names the Deployment <release>-shared-ui and runs the shared-ui image
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: sdg-shared-ui
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/acme/sdg/shared-ui:pr-1
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: sdg
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: shared-ui
            app.kubernetes.io/instance: sdg

  - it: a chart-level image registry and tag override the globals
    template: templates/deployment.yaml
    set:
      image.registry: registry.example.com/team
      image.tag: v2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/team/shared-ui:v2

  - it: fails without an image registry
    template: templates/deployment.yaml
    set:
      global.image.registry: ''
    asserts:
      - failedTemplate:
          errorPattern: image registry is required

  - it: fails without an image tag
    template: templates/deployment.yaml
    set:
      global.image.tag: ''
    asserts:
      - failedTemplate:
          errorPattern: image tag is required

  - it: runs under the restricted SCC with a read-only root and writable Caddy state dirs
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      - notExists:
          path: spec.template.spec.securityContext.runAsUser
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: probes GET /healthz on the http port 8080
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /healthz
            port: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: http

  - it: exposes port 8080 as http on the Service
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sdg-shared-ui
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 8080
            targetPort: http
            protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: shared-ui
            app.kubernetes.io/instance: sdg

  - it: only accepts traffic from the edge on 8080
    template: templates/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: shared-ui
            app.kubernetes.io/instance: sdg
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: edge
                      app.kubernetes.io/instance: sdg
              ports:
                - port: 8080
                  protocol: TCP

  - it: omits the NetworkPolicy when disabled
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no PodDisruptionBudget by default
    template: templates/pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a minAvailable 1 PodDisruptionBudget when enabled
    template: templates/pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: shared-ui
            app.kubernetes.io/instance: sdg

  - it: leaves the rollout strategy to Kubernetes by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy

  - it: renders a strategy when set
    template: templates/deployment.yaml
    set:
      strategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: requests PR-level resources by default (10m / 32Mi), which TEST and PROD inherit
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }

  - it: renders the signed manifest into the fixed-name <release>-shared-ui-manifest ConfigMap as manifest.json
    template: templates/configmap.yaml
    set:
      manifest: '{"keyId":"pr-primary","payload":"eyJ9","sig":"c2ln"}'
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: sdg-shared-ui-manifest
      - equal:
          path: data
          value:
            manifest.json: '{"keyId":"pr-primary","payload":"eyJ9","sig":"c2ln"}'

  - it: renders an empty ConfigMap without a manifest, so Caddy answers 404 and the header fails closed
    template: templates/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - notExists:
          path: data

  - it: mounts the manifest ConfigMap read-only as a directory at /manifest, outside /srv and without subPath
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: manifest
            mountPath: /manifest
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: manifest
            configMap:
              name: sdg-shared-ui-manifest
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2]
          value:
            name: manifest
            mountPath: /manifest
            readOnly: true

  - it: annotates the pod with the manifest's sha256
    template: templates/deployment.yaml
    set:
      manifest: '{"keyId":"pr-primary","payload":"b25l","sig":"c2ln"}'
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/manifest"]
          value: 663d5359558e7ec3212e8dddbb6e7e3e931b514637dac82e62cb483268a11b1e

  - it: a changed manifest changes the checksum, so helm upgrade rolls the pods
    template: templates/deployment.yaml
    set:
      manifest: '{"keyId":"pr-primary","payload":"dHdv","sig":"c2ln"}'
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/manifest"]
          value: 663d5359558e7ec3212e8dddbb6e7e3e931b514637dac82e62cb483268a11b1e

  - it: gives Caddy the keyset whose committed loader it serves
    template: templates/deployment.yaml
    set:
      keyset: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEADER_KEYSET
            value: test

  - it: leaves HEADER_KEYSET unset without a keyset, so the loader is a 404
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
