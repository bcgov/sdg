# shared-ui: the header's CDN bundle served by Caddy on :8080 (packages/shared-ui/Dockerfile). Reached only through the
# edge, at /shared-ui/ on the portal host. Requests stay at PR level (10m / 32Mi) everywhere: a static server needs no
# more.
global:
  image:
    # Registry path shared by the app images, e.g. ghcr.io/<owner>/sdg. Required here or in image.registry.
    registry: ''
    # Image tag, e.g. a PR number (12), a commit SHA or a release version. Required here or in image.tag.
    tag: ''

fullnameOverride: ''
replicaCount: 1
# Deployment rollout strategy, e.g. { type: Recreate }. Empty: Kubernetes' default RollingUpdate.
strategy: {}

image:
  registry: ''
  name: shared-ui
  tag: ''
  pullPolicy: IfNotPresent

# Keyset whose committed loader Caddy serves at /header/v1/loader.js (pr, test or prod; dev is local only). Set per
# environment in charts/sdg/values-<env>.yaml. Empty: no loader (404).
keyset: ''

# The signed manifest envelope (JSON), passed by the deploy job with --set-file shared-ui.manifest=<file>. Empty: an
# empty ConfigMap, so /header/v1/manifest.json is a 404 and the header fails closed.
manifest: ''

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
