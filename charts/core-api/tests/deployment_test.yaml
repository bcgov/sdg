suite: core-api deployment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/service.yaml
  - templates/pdb.yaml
release:
  name: sdg
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-1
  keycloak.issuerUrl: https://keycloak.example.com/realms/portal
  keycloak.portalClientId: portal
tests:
  - it: runs the core-api image with env from the ConfigMap
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: sdg-core-api
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/acme/sdg/core-api:pr-1
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: sdg-core-api
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: reads DATABASE_URL from the core login's Crunchy Secret
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sdg-postgres-pguser-core
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: require

  - it: runs the database image as the core login in its migrate initContainer (KTD9)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: migrate
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/acme/sdg/database:pr-1
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sdg-postgres-pguser-core
                key: uri
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          value: [ALL]

  - it: trusts PGO's CA in both containers, and the system store when none is set
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/postgres-ca/ca.crt
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: postgres-ca
            mountPath: /etc/postgres-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgres-ca
            secret:
              secretName: sdg-postgres-cluster-cert
              items:
                - key: ca.crt
                  path: ca.crt

  - it: drops the CA volume and env without a CA Secret
    template: templates/deployment.yaml
    set:
      database.caSecretName: ''
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/postgres-ca/ca.crt
      - notExists:
          path: spec.template.spec.initContainers[0].volumeMounts
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1

  - it: requests PR-level resources by default (KTD14)
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 384Mi }

  - it: starts with every capability dropped on a read-only root
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: probes liveness and readiness on /healthz
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz/ready
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz/live

  # MDD 20-observability-lgtm
  - it: carries scrape annotations only when a scraper namespace is set
    template: templates/deployment.yaml
    set:
      global.observability.scraperNamespace: abc123-tools
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sdg.gov.bc.ca/scrape"]
          value: 'true'
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: sdg

  - it: exposes port 3000 through its Service
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sdg-core-api
      - equal:
          path: spec.ports[0].port
          value: 3000

  - it: renders a PodDisruptionBudget only when enabled
    template: templates/pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
