{{- if .Values.networkPolicy.enabled }}
# Only the edge proxies to portal-api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "common.peerSelectorLabels" (dict "name" "edge" "context" $) | nindent 14 }}
      ports:
        - port: 3000
          protocol: TCP
{{- end }}
