# Non-secret env for src/config/env.ts. Secrets come from the Crunchy Secret and Vault (deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "api") | nindent 4 }}
data:
  NODE_ENV: production
  PORT: '3000'
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  APP_URL: {{ include "portal-api.appUrl" . | quote }}
  # Ingress -> edge -> portal-api: trust X-Forwarded-* from the proxies.
  TRUST_PROXY: 'true'
  SESSION_TTL_SECONDS: {{ .Values.sessionTtlSeconds | quote }}
  KEYCLOAK_ISSUER_URL: {{ .Values.keycloak.issuerUrl | required "keycloak.issuerUrl is required" | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | required "keycloak.clientId is required" | quote }}
  {{- with include "common.tplvalue" (dict "value" .Values.notificationApiUrl "context" .) }}
  NOTIFICATION_API_URL: {{ . | quote }}
  {{- end }}
  {{- $o := include "common.observability" . | fromYaml }}
  {{- with $o.collectorHost }}
  # OpenTelemetry (src/instrumentation.ts): only when a collector is configured.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s:4318" . | quote }}
  OTEL_SERVICE_NAME: portal-api
  {{- with $o.environment }}
  OTEL_RESOURCE_ATTRIBUTES: {{ printf "deployment.environment=%s" . | quote }}
  {{- end }}
  {{- end }}
