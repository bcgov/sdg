suite: portal-api configmap
templates:
  - templates/configmap.yaml
release:
  name: sdg
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-1
  global.host: sdg.example.com
  keycloak.issuerUrl: https://keycloak.example.com/realms/portal
  keycloak.clientId: portal
  vault.role: abc123-nonprod
  vault.secretPath: abc123-nonprod/portal-api
  vault.serviceAccountName: abc123-vault
tests:
  - it: holds the non-secret env for the zod schema
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: sdg-portal-api
      - equal:
          path: data
          value:
            NODE_ENV: production
            PORT: '3000'
            LOG_LEVEL: info
            APP_URL: https://sdg.example.com
            TRUST_PROXY: 'true'
            SESSION_TTL_SECONDS: '28800'
            KEYCLOAK_ISSUER_URL: https://keycloak.example.com/realms/portal
            KEYCLOAK_CLIENT_ID: portal
            NOTIFICATION_API_URL: http://sdg-notification-api:3000

  - it: points NOTIFICATION_API_URL at the release's notification-api Service
    asserts:
      - equal:
          path: data.NOTIFICATION_API_URL
          value: http://sdg-notification-api:3000

  - it: omits NOTIFICATION_API_URL when notificationApiUrl is empty
    set:
      notificationApiUrl: ''
    asserts:
      - notExists:
          path: data.NOTIFICATION_API_URL

  - it: an explicit appUrl wins over global.host
    set:
      appUrl: https://portal.gov.bc.ca
    asserts:
      - equal:
          path: data.APP_URL
          value: https://portal.gov.bc.ca

  - it: fails when neither appUrl nor global.host is set
    set:
      global.host: ''
    asserts:
      - failedTemplate:
          errorPattern: appUrl or global.host is required

  - it: fails without a Keycloak issuer URL
    set:
      keycloak.issuerUrl: ''
    asserts:
      - failedTemplate:
          errorPattern: keycloak.issuerUrl is required

  - it: fails without a Keycloak client id
    set:
      keycloak.clientId: ''
    asserts:
      - failedTemplate:
          errorPattern: keycloak.clientId is required

  - it: never contains secret keys
    asserts:
      - notExists:
          path: data.SESSION_SECRET
      - notExists:
          path: data.KEYCLOAK_CLIENT_SECRET
      - notExists:
          path: data.DATABASE_URL

  # MDD 20-observability-lgtm
  - it: sets the OTLP endpoint and resource attributes when a collector is configured
    set:
      global.observability.collectorHost: observability-alloy.abc123-tools.svc
      global.observability.environment: test
    asserts:
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://observability-alloy.abc123-tools.svc:4318
      - equal:
          path: data.OTEL_SERVICE_NAME
          value: portal-api
      - equal:
          path: data.OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=test

  - it: sets no OTEL vars when observability is not configured
    asserts:
      - notExists:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
      - notExists:
          path: data.OTEL_RESOURCE_ATTRIBUTES
