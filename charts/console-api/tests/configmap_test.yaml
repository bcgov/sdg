suite: console-api configmap
templates:
  - templates/configmap.yaml
release:
  name: sdg
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-1
  global.consoleHost: sdg-console.example.com
  keycloak.issuerUrl: https://keycloak.example.com/realms/portal
  keycloak.clientId: sdg-console
  vault.role: abc123-nonprod
  vault.secretPath: abc123-nonprod/console-api
  vault.serviceAccountName: abc123-vault
tests:
  - it: holds the non-secret env for the zod schema
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: sdg-console-api
      - equal:
          path: data
          value:
            NODE_ENV: production
            PORT: '3000'
            LOG_LEVEL: info
            APP_URL: https://sdg-console.example.com
            TRUST_PROXY: 'true'
            SESSION_TTL_SECONDS: '28800'
            KEYCLOAK_ISSUER_URL: https://keycloak.example.com/realms/portal
            KEYCLOAK_CLIENT_ID: sdg-console
            CORE_API_URL: http://sdg-core-api:3000

  - it: an explicit coreApiUrl wins over the release's core-api Service
    set:
      coreApiUrl: http://core-api.other.svc:3000
    asserts:
      - equal:
          path: data.CORE_API_URL
          value: http://core-api.other.svc:3000

  - it: fails without a core-api URL
    set:
      coreApiUrl: ''
    asserts:
      - failedTemplate:
          errorPattern: coreApiUrl is required

  - it: derives APP_URL from the console host, never the portal host
    set:
      global.host: sdg.example.com
    asserts:
      - equal:
          path: data.APP_URL
          value: https://sdg-console.example.com

  - it: an explicit appUrl wins over global.consoleHost
    set:
      appUrl: https://console.sdg.gov.bc.ca
    asserts:
      - equal:
          path: data.APP_URL
          value: https://console.sdg.gov.bc.ca

  - it: fails when neither appUrl nor global.consoleHost is set
    set:
      global.consoleHost: ''
    asserts:
      - failedTemplate:
          errorPattern: appUrl or global.consoleHost is required

  - it: fails without a Keycloak issuer URL
    set:
      keycloak.issuerUrl: ''
    asserts:
      - failedTemplate:
          errorPattern: keycloak.issuerUrl is required

  - it: fails without a Keycloak client id
    set:
      keycloak.clientId: ''
    asserts:
      - failedTemplate:
          errorPattern: keycloak.clientId is required

  - it: never contains secret keys
    asserts:
      - notExists:
          path: data.SESSION_SECRET
      - notExists:
          path: data.KEYCLOAK_CLIENT_SECRET
      - notExists:
          path: data.DATABASE_URL

  - it: sets the OTLP endpoint and resource attributes when a collector is configured
    set:
      global.observability.collectorHost: observability-alloy.abc123-tools.svc
      global.observability.environment: test
    asserts:
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://observability-alloy.abc123-tools.svc:4318
      - equal:
          path: data.OTEL_SERVICE_NAME
          value: console-api
      - equal:
          path: data.OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=test

  - it: sets no OTEL vars when observability is not configured
    asserts:
      - notExists:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
      - notExists:
          path: data.OTEL_RESOURCE_ATTRIBUTES
