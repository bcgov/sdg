# console-api: the console's BFF (apps/console-api on bff-core), which forwards to core-api. Its own image applies
# the sessions migrations as an initContainer. Env contract: apps/console-api/src/config/env.ts. Reached only through
# the edge, on the console host.
global:
  image:
    # Registry path shared by the app images, e.g. ghcr.io/<owner>/sdg. Required here or in image.registry.
    registry: ''
    # Image tag, e.g. a PR number (12), a commit SHA or a release version. Required here or in image.tag.
    tag: ''
  # Console hostname (console-web and /api); APP_URL defaults to https://<consoleHost>.
  consoleHost: ''
  # Observability: empty = off. See common.observability in charts/common.
  observability:
    collectorHost: ''
    scraperNamespace: ''
    environment: ''

fullnameOverride: ''
replicaCount: 1
# Deployment rollout strategy, e.g. { type: Recreate }. Empty: Kubernetes' default RollingUpdate.
strategy: {}

image:
  registry: ''
  name: console-api
  tag: ''
  pullPolicy: IfNotPresent

# The sessions migration (node dist/migrate.js in the console-api image) as the console login, before console-api starts.
migrator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# Public origin of console-web; the OIDC redirect URIs and the not-authorized page derive from it.
# Empty: https://<global.consoleHost>.
appUrl: ''
logLevel: info
sessionTtlSeconds: 28800

# core-api's Service (same release): sign-in upserts the principal there and /api/v<N>/{console,shared}/… is forwarded.
coreApiUrl: 'http://{{ .Release.Name }}-core-api:3000'

keycloak:
  # Required, e.g. https://keycloak.example.com/realms/portal
  issuerUrl: ''
  # Required: the console (IDIR) confidential client id, also core-api's keycloak.consoleClientId. Its secret comes from
  # Vault (or existingSecret).
  clientId: ''

# Crunchy PGO user Secret for the console login (<cluster>-pguser-console), which owns only the console schema (sessions);
# use key pgbouncer-uri when PgBouncer is enabled.
database:
  secretName: '{{ .Release.Name }}-postgres-pguser-console'
  secretKey: uri
  # PGO only accepts TLS and its uri has no sslmode: node-postgres reads PGSSLMODE (require = verified TLS).
  sslMode: require
  # PGO's CA (<cluster>-cluster-cert), trusted through NODE_EXTRA_CA_CERTS. Empty: the system trust store.
  caSecretName: '{{ .Release.Name }}-postgres-cluster-cert'
  caSecretKey: ca.crt

# Secrets issued outside the cluster (SESSION_SECRET, KEYCLOAK_CLIENT_SECRET) via the Vault Agent Injector.
# The agent init container renders /vault/secrets/console-api.env (dotenv) and node loads it with --env-file.
# Values must not contain ' or newlines.
vault:
  enabled: true
  # Required when enabled, e.g. abc123-nonprod
  role: ''
  authPath: auth/k8s-silver
  namespace: platform-services
  # Required when enabled: KV v2 path, e.g. abc123-nonprod/console-api
  secretPath: ''
  # Required when enabled: the service account Vault's role trusts, e.g. abc123-vault
  serviceAccountName: ''
  keys:
    - SESSION_SECRET
    - KEYCLOAK_CLIENT_SECRET
  # The injector's defaults (250m CPU request) don't fit small namespace quotas; the init-only agent needs little.
  agentResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Used when vault.enabled is false: a Secret holding the same keys, loaded with envFrom.
existingSecret: ''

# PR-level requests by default, which TEST and PROD inherit.
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 384Mi

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
