suite: edge
release:
  name: sdg
set:
  global.image.registry: ghcr.io/acme/sdg
  global.image.tag: pr-1
  global.host: sdg.example.com
tests:
  - it: runs the edge image with upstreams pointing at the release's services
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: sdg-edge
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/acme/sdg/edge:pr-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTAL_API_URL
            value: http://sdg-portal-api:3000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTAL_WEB_URL
            value: http://sdg-portal-web:8080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: INFO

  - it: upstream URLs can be overridden
    template: templates/deployment.yaml
    set:
      upstreams.portalApi: http://api.other:3000
      upstreams.portalWeb: http://web.other:8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTAL_API_URL
            value: http://api.other:3000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTAL_WEB_URL
            value: http://web.other:8080

  - it: listens on http 3000 and metrics 3003 and probes the http socket
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 3003
              protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http

  - it: runs restricted with a read-only root and writable Caddy/Coraza dirs
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: coraza
              mountPath: /tmp/coraza

  - it: exposes only http on the Service that Routes target
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sdg-edge
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 3000
              targetPort: http
              protocol: TCP

  # A Route without a target port (e.g. bcgov/actions-openshift/route-tls) can use every port of its Service.
  - it: exposes metrics on a separate Service
    template: templates/metrics-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: sdg-edge-metrics
      - equal:
          path: spec.ports
          value:
            - name: metrics
              port: 3003
              targetPort: metrics
              protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: edge
            app.kubernetes.io/instance: sdg

  - it: renders a standard Ingress that OpenShift turns into an edge-TLS Route on the default certificate (tls [{}])
    template: templates/ingress.yaml
    asserts:
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.annotations
          value:
            route.openshift.io/termination: edge
            # No router sticky-session cookie (ZAP 10054): the edge is stateless.
            haproxy.router.openshift.io/disable_cookies: 'true'
      - equal:
          path: spec.rules[0]
          value:
            host: sdg.example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: sdg-edge
                      port:
                        name: http
      - equal:
          path: spec.tls
          value:
            - {}
      - notExists:
          path: spec.ingressClassName

  - it: ingress host, class, TLS secret and annotations are configurable
    template: templates/ingress.yaml
    set:
      ingress.host: portal.gov.bc.ca
      ingress.className: nginx
      ingress.tls.secretName: portal-tls
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
    asserts:
      - equal:
          path: spec.rules[0].host
          value: portal.gov.bc.ca
      - equal:
          path: spec.ingressClassName
          value: nginx
      # The notification host stays derived from global.host, so the secret's certificate must cover it too.
      - equal:
          path: spec.rules[1].host
          value: sdg-notify.example.com
      - equal:
          path: spec.tls
          value:
            - hosts: [portal.gov.bc.ca, sdg-notify.example.com]
              secretName: portal-tls
      - equal:
          path: metadata.annotations
          value:
            cert-manager.io/cluster-issuer: letsencrypt

  - it: fails without a host
    template: templates/ingress.yaml
    set:
      global.host: ''
    asserts:
      - failedTemplate:
          errorPattern: ingress.host or global.host is required

  - it: omits the Ingress when disabled
    template: templates/ingress.yaml
    set:
      ingress.enabled: false
      global.host: ''
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts traffic on 3000 only from the router namespaces
    template: templates/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: edge
            app.kubernetes.io/instance: sdg
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      network.openshift.io/policy-group: ingress
              ports:
                - port: 3000
                  protocol: TCP

  - it: router namespace selector is configurable
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.ingressNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: ingress-nginx

  - it: renders a PodDisruptionBudget only when enabled
    template: templates/pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: leaves the rollout strategy to Kubernetes by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.strategy

  - it: renders a strategy when set
    template: templates/deployment.yaml
    set:
      strategy:
        type: Recreate
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  # KTD8: notification-api's public host is one DNS label, <first label>-notify, so the router's single-label
  # wildcard certificate covers it. common.notifyHost derives it; KTD7's WAF host rule matches that shape.
  - it: serves the derived notification host on the same Ingress and default certificate
    template: templates/ingress.yaml
    release:
      name: sdg-12
    set:
      global.host: sdg-12.apps.gold.devops.gov.bc.ca
    asserts:
      - equal:
          path: spec.rules
          value:
            - host: sdg-12.apps.gold.devops.gov.bc.ca
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: sdg-12-edge
                        port:
                          name: http
            - host: sdg-12-notify.apps.gold.devops.gov.bc.ca
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: sdg-12-edge
                        port:
                          name: http
      - equal:
          path: spec.tls
          value:
            - {}

  - it: has no notification host rule without global.host
    template: templates/ingress.yaml
    set:
      global.host: ''
      ingress.host: portal.gov.bc.ca
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].host
          value: portal.gov.bc.ca

  - it: routes the notification host to notification-api (common.caddy notify_on)
    template: templates/deployment.yaml
    release:
      name: sdg-12
    set:
      global.host: sdg-12.apps.gold.devops.gov.bc.ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NOTIFY
            value: 'on'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NOTIFY_HOST
            value: sdg-12-notify.apps.gold.devops.gov.bc.ca
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NOTIFICATION_API_URL
            value: http://sdg-12-notification-api:3000

  # Always set: Caddy fails on an empty host matcher, and {$NOTIFY:off} doesn't cover a set-but-empty variable.
  - it: turns the notification host off when no host resolves
    template: templates/deployment.yaml
    set:
      global.host: ''
      ingress.host: portal.gov.bc.ca
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NOTIFY
            value: 'off'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NOTIFY_HOST
            value: ''

  - it: notification-api upstream can be overridden
    template: templates/deployment.yaml
    set:
      upstreams.notificationApi: http://notify.other:3000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NOTIFICATION_API_URL
            value: http://notify.other:3000
