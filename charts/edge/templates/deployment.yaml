apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "edge") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.labels" (dict "context" . "component" "edge") | nindent 8 }}
      {{- with include "common.scrapeAnnotations" (dict "context" . "port" 3003) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: edge
          image: {{ include "common.image" (dict "image" .Values.image "context" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORTAL_API_URL
              value: {{ include "common.tplvalue" (dict "value" .Values.upstreams.portalApi "context" .) | quote }}
            - name: PORTAL_WEB_URL
              value: {{ include "common.tplvalue" (dict "value" .Values.upstreams.portalWeb "context" .) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # notification-api's public host (common.caddy notify_on). Always set, because Caddy fails on an empty
            # host matcher and {$NOTIFY:off} doesn't cover a set-but-empty variable.
            {{- $notifyHost := include "common.notifyHost" . }}
            - name: NOTIFY
              value: {{ ternary "on" "off" (ne $notifyHost "") | quote }}
            - name: NOTIFY_HOST
              value: {{ $notifyHost | quote }}
            - name: NOTIFICATION_API_URL
              value: {{ include "common.tplvalue" (dict "value" .Values.upstreams.notificationApi "context" .) | quote }}
            {{- $o := include "common.observability" . | fromYaml }}
            {{- with $o.collectorHost }}
            # Browser telemetry: /collect proxies to Alloy's Faro receiver (common.caddy collect_on).
            - name: TELEMETRY
              value: 'on'
            - name: FARO_COLLECTOR_URL
              value: {{ printf "http://%s:12347" . | quote }}
            - name: TELEMETRY_ENVIRONMENT
              value: {{ $o.environment | default "unknown" | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 3003
              protocol: TCP
          # TCP, not HTTP: a proxied request would tie the edge's health to its upstreams.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          securityContext:
            {{- include "common.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Caddy state (XDG dirs in the image), /tmp (Coraza's startup filesystem check writes there) and Coraza's
          # SecTmpDir/SecDataDir.
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: coraza
              mountPath: /tmp/coraza
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: coraza
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
