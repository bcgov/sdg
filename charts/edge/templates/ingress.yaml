{{- if .Values.ingress.enabled }}
{{- $hosts := list (include "edge.host" (list . "host") | required "ingress.host or global.host is required") }}
{{- range list "consoleHost" "gatewayHost" }}
{{- with include "edge.host" (list $ .) }}
{{- $hosts = append $hosts . }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" (dict "context" . "component" "edge") | nindent 4 }}
  {{- /* disable_cookies: no router sticky-session cookie (SameSite=None; ZAP 10054). The edge is stateless. */}}
  {{- with .Values.ingress.annotations | default (dict "route.openshift.io/termination" "edge" "haproxy.router.openshift.io/disable_cookies" "true") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    {{- with .Values.ingress.tls.secretName }}
    - hosts: {{ $hosts | toJson }}
      secretName: {{ . }}
    {{- else }}
    # OpenShift's form for the router's default certificate: hosts without a secret are rejected.
    - {}
    {{- end }}
  # One rule per host (OpenShift makes a Route for each), all to the edge, which routes by Host.
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "common.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
